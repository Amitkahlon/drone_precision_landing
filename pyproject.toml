[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-landing"
version = "0.1.0"
description = "MuJoCo simulation of a quadrotor landing on a moving platform"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.8.1",
    "numpy==2.4.6",
    "glfw==2.10.0",
    "PyOpenGL==3.1.10",
]

[project.optional-dependencies]
dev = ["pytest==9.0.1"]

[project.scripts]
drone-batch = "drone_landing.cli.batch:main"
drone-fly = "drone_landing.cli.fly:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drone_landing = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
